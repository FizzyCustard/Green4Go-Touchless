; Green4Go: Waveshare ESP32-S3-LCD-2 (16MB flash, 8MB PSRAM)
;
; The platform is pinned: 6.12.0 bundles Arduino-ESP32 2.0.17, the core this
; firmware is built and tested against. Core 3.x changes the LEDC (backlight)
; API and won't compile without changes.

[env:esp32s3]
platform = platformio/espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv ; Two 6.25MB app slots for OTA
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.9
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Over-the-air uploads (after one USB flash with OTA_PASSWORD set in secrets.h):
;   export GREEN4GO_OTA_PASSWORD=your-password
;   pio run -e esp32s3_ota -t upload
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = green4go.local
upload_flags =
    --auth=${sysenv.GREEN4GO_OTA_PASSWORD}
