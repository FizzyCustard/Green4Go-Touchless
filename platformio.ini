[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = 
    moononournation/GFX Library for Arduino @ 1.4.9
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Over-the-air uploads (after one USB flash with OTA_PASSWORD set in secrets.h):
;   export GREEN4GO_OTA_PASSWORD=your-password
;   pio run -e esp32s3_ota -t upload
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = green4go.local
upload_flags =
    --auth=${sysenv.GREEN4GO_OTA_PASSWORD}
