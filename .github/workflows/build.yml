name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      # secrets.h is gitignored: build with the template, once with OTA off
      # and once with it on so both code paths compile
      - name: Build (OTA disabled)
        run: |
          cp src/secrets.example.h src/secrets.h
          pio run -e esp32s3
      - name: Build (OTA enabled)
        run: |
          sed -i 's|// #define OTA_PASSWORD "use-a-long-random-password"|#define OTA_PASSWORD "ci-only-password-1234"|' src/secrets.h
          grep -q '^#define OTA_PASSWORD' src/secrets.h
          pio run -e esp32s3
